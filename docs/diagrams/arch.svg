    <text x="445" y="553" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Trustee Agent</text>
    <text x="445" y="571" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">Remote Attestation</text>
    <rect x="535" y="532" width="150" height="50" rx="6" fill="#fff" stroke="#9673a6" stroke-width="1.5"/>
    <text x="610" y="553" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Key Broker Service</text>
    <text x="610" y="571" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">Encryption Keys</text>
    <path d="M 515 557 L 535 557" fill="none" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="530" y="605" fill="#9673a6" font-family="Arial" font-size="9" text-anchor="middle">Verified before key release</text>
    <rect x="375" y="615" width="310" height="30" rx="5" fill="#fff" stroke="#9673a6" stroke-width="1"/>
    <text x="530" y="635" fill="#9673a6" font-family="Arial" font-size="9" text-anchor="middle">Intel TDX Quote Verification</text>

