    <text x="880" y="145" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">vLLM Service</text>
    <text x="880" y="163" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">vllm-service</text>
    <text x="880" y="178" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">NodePort: 8080</text>
    <path d="M 880 188 L 880 230" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Kata / TDX boundary -->
    <rect x="340" y="230" width="760" height="440" rx="12" fill="#fff0f0" stroke="#cc0000" stroke-width="2.5"/>
    <text x="720" y="255" fill="#cc0000" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Kata Container (Trust Domain - Intel TDX Protected VM)</text>

    <!-- vLLM Server Container -->
    <rect x="360" y="268" width="720" height="140" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="720" y="293" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">vLLM Server Container</text>
    <text x="720" y="311" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">quay.io/confidential-devhub/rhaiis:latest</text>

