    <rect x="380" y="320" width="200" height="70" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="480" y="345" fill="#1a1a2e" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">vLLM Engine</text>
    <text x="480" y="363" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">OpenAI Compatible</text>
    <text x="480" y="378" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">API Server :8080</text>

    <!-- Model -->
    <rect x="620" y="320" width="200" height="70" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="720" y="345" fill="#1a1a2e" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Model</text>
    <text x="720" y="363" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">Llama-4-Scout-17B</text>
    <text x="720" y="378" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">w4a16 quantized</text>

    <!-- GPU -->
    <rect x="860" y="320" width="200" height="70" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="960" y="345" fill="#1a1a2e" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">NVIDIA GPU</text>
    <text x="960" y="363" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">H100/H200/B200</text>
    <text x="960" y="378" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">CC Mode Enabled</text>

