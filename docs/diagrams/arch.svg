<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9673a6"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9673a6"/>
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d6b656"/>
    </marker>
  </defs>
  <g>
    <rect x="0" y="0" width="1200" height="800" fill="#f5f5f5"/>
    <text x="600" y="40" fill="#1a1a2e" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Confidential AI Inference Architecture</text>

    <!-- User -->
    <rect x="40" y="70" width="200" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="140" y="100" fill="#1a1a2e" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">User</text>
    <text x="140" y="120" fill="#1a1a2e" font-family="Arial" font-size="11" text-anchor="middle">Web Browser</text>
    <text x="140" y="138" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">HTTPS</text>
    <path d="M 240 110 L 320 110" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="105" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">TLS</text>

    <!-- OpenShift Cluster -->
    <rect x="300" y="55" width="860" height="720" rx="15" fill="#fff" stroke="#cc0000" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="730" y="78" fill="#cc0000" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Red Hat OpenShift Cluster</text>

    <!-- Namespace -->
    <rect x="320" y="88" width="820" height="672" rx="12" fill="#f9f9f9" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="730" y="108" fill="#666" font-family="Arial" font-size="11" text-anchor="middle">Namespace: confidential-ai-inference</text>

    <!-- OpenShift Route -->
    <rect x="340" y="118" width="160" height="70" rx="8" fill="#ffe6cc" stroke="#d6b656" stroke-width="2"/>
    <text x="420" y="145" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">OpenShift Route</text>
    <text x="420" y="163" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">open-webui</text>
    <text x="420" y="178" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">edge/TLS termination</text>
    <path d="M 500 153 L 560 153" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Open WebUI -->
    <rect x="560" y="118" width="180" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="650" y="145" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Open WebUI</text>
    <text x="650" y="163" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">ghcr.io/open-webui</text>
    <text x="650" y="178" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">Port: 8080</text>
    <path d="M 740 153 L 800 153" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="770" y="145" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">OpenAI</text>
    <text x="770" y="158" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">API v1</text>

