    <rect x="360" y="428" width="720" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="720" y="453" fill="#b85450" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Encrypted Memory (TDX)</text>
    <text x="720" y="475" fill="#b85450" font-family="Arial" font-size="10" text-anchor="middle">Model weights, KV cache, user queries - all encrypted at rest and in use</text>

