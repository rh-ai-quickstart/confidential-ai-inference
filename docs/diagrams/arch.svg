    <rect x="720" y="500" width="340" height="155" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="890" y="523" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Kata Runtime</text>
    <rect x="735" y="532" width="145" height="50" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
    <text x="807" y="553" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">RuntimeClass</text>
    <text x="807" y="571" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">kata-qemu-nvidia-gpu-tdx</text>
    <rect x="895" y="532" width="150" height="50" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
    <text x="970" y="553" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Kata Shim</text>
    <text x="970" y="571" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">kata-as-coco-runtime</text>
    <rect x="735" y="595" width="310" height="50" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
    <text x="890" y="617" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Node Labels (NFD)</text>
    <text x="890" y="635" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">katacontainers.io/kata-runtime: true</text>

    <!-- Operators -->
    <rect x="320" y="695" width="820" height="55" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <text x="730" y="715" fill="#666" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Cluster Operators (one-time setup via OperatorHub)</text>
    <rect x="335" y="722" width="180" height="22" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
    <text x="425" y="738" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">OpenShift Sandboxed Containers</text>
    <rect x="525" y="722" width="150" height="22" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
    <text x="600" y="738" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">Node Feature Discovery</text>
    <rect x="685" y="722" width="150" height="22" rx="4" fill="#ffe6cc" stroke="#d6b656" stroke-width="1"/>
    <text x="760" y="738" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">NVIDIA GPU Operator</text>
    <rect x="845" y="722" width="150" height="22" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
    <text x="920" y="738" fill="#1a1a2e" font-family="Arial" font-size="9" text-anchor="middle">Red Hat OpenShift AI</text>

    <!-- PVC -->
    <rect x="40" y="230" width="200" height="80" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
    <text x="140" y="258" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Persistent Storage</text>
    <text x="140" y="278" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">PVC: models-cache-pvc</text>
    <text x="140" y="295" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">64Gi (model weights)</text>
    <path d="M 240 270 L 360 310" fill="none" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow3)"/>

    <!-- HuggingFace -->
    <rect x="40" y="350" width="200" height="80" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="140" y="378" fill="#1a1a2e" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HuggingFace</text>
    <text x="140" y="398" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">Model Download</text>
    <text x="140" y="415" fill="#1a1a2e" font-family="Arial" font-size="10" text-anchor="middle">(init container)</text>
    <path d="M 140 350 L 140 310" fill="none" stroke="#d6b656" stroke-width="1.5" marker-end="url(#arrow4)"/>
  </g>
</svg>
