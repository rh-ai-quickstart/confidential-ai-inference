apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: tdx-feature-rule
spec:
  rules:
    - name: "intel-tdx"
      labels:
        "intel.feature.node.kubernetes.io/tdx": "true"
      matchFeatures:
        - feature: cpu.security
          matchExpressions:
            tdx.enabled:
              op: IsTrue
---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: nvidia-gpu-feature-rule
spec:
  rules:
    - name: "nvidia-gpu"
      labels:
        "nvidia.com/gpu.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value:
                - "10de"  # NVIDIA vendor ID