apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gpu
  labels:
    app: vllm
    component: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      component: vllm
  template:
    metadata:
      labels:
        app: vllm
        component: vllm
      annotations:
        cdi.k8s.io/gpu: nvidia.com/gpu=0
        io.katacontainers.config.hypervisor.default_memory: '263840'
        io.katacontainers.config.hypervisor.default_vcpus: '12'
        io.katacontainers.config.hypervisor.kernel_params: agent.log=debug log_buf_len=1M systemd.log_level=debug debug systemd.log_target=console systemd.journald.forward_to_console=1 console=ttyS0 debug initrd=initrd
        io.katacontainers.config.runtime.create_container_timeout: '900'
    spec:
      serviceAccountName: {{ .Values.sa }}
      restartPolicy: Always
      schedulerName: default-scheduler
      affinity: {}
      terminationGracePeriodSeconds: 120
      runtimeClassName: kata-nvidia-gpu-cc
      securityContext:
        runAsUser: 0
      initContainers:
        - name: download-model
          image: quay.io/confidential-devhub/rhaiis:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              mkdir -p /models-cache/hf && mkdir -p /models-cache/.cache && export HF_HOME=/models-cache/hf && export HF_HUB_OFFLINE=0 && huggingface-cli download --cache-dir /models-cache/.cache --local-dir-use-symlinks False --revision main --local-dir /models-cache/Llama-4-Scout-17B-16E-Instruct-quantized RedHatAI/Llama-4-Scout-17B-16E-Instruct-quantized.w4a16
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
      containers:
        - name: server
          image: 'quay.io/confidential-devhub/rhaiis:latest'
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              echo '/usr/lib64' >> /etc/ld.so.conf.d/nvidia.conf && ldconfig && python3 -m vllm.entrypoints.openai.api_server --port=8080 --model=/models-cache/Llama-4-Scout-17B-16E-Instruct-quantized --served-model-name=llama-4-scout-17b --enforce-eager --tensor-parallel-size=1 --enable-auto-tool-choice --tool-call-parser=llama4_pythonic --enable_prefix_caching --gpu-memory-utilization=0.98 --trust-remote-code --max-model-len=32000 --enable-chunked-prefill
          resources:
            limits:
              nvidia.com/GH100_H100_PCIE: '1'
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              value: ""
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 8
            periodSeconds: 100
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 24
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: models-cache
              mountPath: /models-cache
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: models-cache
          emptyDir:
            sizeLimit: 30Gi
      dnsPolicy: ClusterFirst
      tolerations:
        - key: nvidia.com/GH100_H100_PCIE
          effect: NoSchedule
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
