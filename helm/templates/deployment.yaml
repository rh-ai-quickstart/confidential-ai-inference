apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ .Values.device }}-confidential
  labels:
    app: vllm
    component: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      component: vllm
  template:
    metadata:
      labels:
        app: vllm
        component: vllm
      annotations:
        io.katacontainers.config.hypervisor.default_memory: {{ (index .Values.deploymentConfigs .Values.device).katacontainers.memory | quote }}
        io.katacontainers.config.hypervisor.kernel_params: "agent.guest_components_rest_api=all"
        io.katacontainers.config.hypervisor.cc_init_data: 
        io.katacontainers.config.runtime.create_container_timeout: '7200'
    spec:
      serviceAccountName: {{ .Values.sa }}
      restartPolicy: Always
      schedulerName: default-scheduler
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
      terminationGracePeriodSeconds: 60
      {{- with (index .Values.deploymentConfigs .Values.device).katacontainers.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsUser: 0
        seLinuxOptions:
          level: "s0:c29,c4"
      {{- with (index .Values.deploymentConfigs .Values.device).nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-attestation
          image: storytel/alpine-bash-curl:latest
          command: [ "/bin/sh","-c" ]
          args:
            - echo starting;
              (curl http://127.0.0.1:8006/aa/token\?token_type\=kbs | grep -iv "get token failed" | grep -iv "error" | grep -i token && echo "ATTESTATION COMPLETED SUCCESSFULLY") || (echo "ATTESTATION FAILED" && exit 1);
        - name: download-model
          image: {{ (index .Values.deploymentConfigs .Values.device).image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              if [ -d "/models-cache/{{ (index .Values.model .Values.device).localDir }}" ] && [ "$(ls -A /models-cache/{{ (index .Values.model .Values.device).localDir }})" ]; then
                echo "Model already exists at /models-cache/{{ (index .Values.model .Values.device).localDir }}, skipping download"
                exit 0
              fi
              mkdir -p /models-cache/hf && \
              mkdir -p /models-cache/.cache && \
              export HF_HOME=/models-cache/hf && \
              export HF_HUB_OFFLINE=0 && \
              huggingface-cli download \
                --cache-dir /models-cache/.cache \
                --local-dir-use-symlinks False \
                --revision main \
                --local-dir /models-cache/{{ (index .Values.model .Values.device).localDir }} \
                {{ (index .Values.model .Values.device).repo }}
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-secret
                  key: token
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
      containers:
        - name: server
          image: {{ (index .Values.deploymentConfigs .Values.device).image }}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          command:
            - /bin/bash
            - -c
            - |
              {{- if eq .Values.device "gpu" }}
              echo '/usr/lib64' >> /etc/ld.so.conf.d/nvidia.conf && ldconfig && \
              {{- end }}
              python3 -m vllm.entrypoints.openai.api_server \
                --port=8080 \
                --model=/models-cache/{{ (index .Values.model .Values.device).localDir }} \
                --served-model-name={{ (index .Values.model .Values.device).servedName }} \
                --enable-auto-tool-choice \
                --tool-call-parser={{ (index .Values.model .Values.device).toolCallParser }} \
                --trust-remote-code \
                {{ join " \\\n                " (index .Values.model .Values.device).args }}
          {{- with (index .Values.deploymentConfigs .Values.device).resources }}
          resources:
            limits:
              cpu: {{ .limits.cpu }}
              memory: {{ .limits.memory }}
              {{- with (index $.Values.deploymentConfigs $.Values.device).katacontainers.resourceName }}
              {{ . }}: '1'
              {{- end }}
            requests:
              cpu: {{ .requests.cpu }}
              memory: {{ .requests.memory }}
              {{- with (index $.Values.deploymentConfigs $.Values.device).katacontainers.resourceName }}
              {{ . }}: '1'
              {{- end }}
          {{- end }}
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-secret
                  key: token
            {{- range $key, $val := (index .Values.deploymentConfigs .Values.device).env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              drop:
                - MKNOD
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 8
            periodSeconds: 100
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 120
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: models-cache
              mountPath: /models-cache
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: models-cache
          emptyDir:
            sizeLimit: {{ .Values.modelCache.storageSize }}
      dnsPolicy: ClusterFirst
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        {{- with (index .Values.deploymentConfigs .Values.device).katacontainers.resourceName }}
        - key: {{ . }}
          operator: Exists
          effect: NoSchedule
        {{- end }}
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
